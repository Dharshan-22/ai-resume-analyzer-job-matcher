# Active Spring Profile (Loads application-local.properties for sensitive credentials)
spring.profiles.active=local

# Server Configuration
server.port=8080
spring.application.name=AI Resume Analyzer & Job Matcher

# File Upload Limits (Prepared for Phase 3 resume uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.resume.analyzer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
